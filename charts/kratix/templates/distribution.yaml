    failurePolicy: Fail
    name: vpromise.kb.io
    rules:
      - apiGroups:
          - platform.kratix.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - promises
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kratix-platform-webhook-service
