apiVersion: v1
data:
  PIPELINE_ADAPTER_IMG: docker.io/syntasso/kratix-platform-pipeline-adapter:dev
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: kratix-manager
    app.kubernetes.io/instance: kratix-platform
    app.kubernetes.io/part-of: kratix
  name: kratix-platform-pipeline-adapter-config
  namespace: kratix-platform-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: kratix
    app.kubernetes.io/instance: webhook-service
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: service
    app.kubernetes.io/part-of: kratix
  name: kratix-platform-webhook-service
  namespace: kratix-platform-system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: kratix-manager
    app.kubernetes.io/instance: kratix-platform
    app.kubernetes.io/part-of: kratix
    control-plane: controller-manager
  name: kratix-platform-controller-manager
  namespace: kratix-platform-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: kratix-manager
      app.kubernetes.io/instance: kratix-platform
      app.kubernetes.io/part-of: kratix
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kratix-manager
        app.kubernetes.io/instance: kratix-platform
        app.kubernetes.io/part-of: kratix
        control-plane: controller-manager
    spec:
      containers:
        - args:
            - --controllers=promise
            - --health-probe-bind-address=:8081
            - --leader-elect
            - --leader-election-id=2743c979.promise.kratix.io
          command:
            - /manager
          env:
            - name: PIPELINE_ADAPTER_IMG
              valueFrom:
                configMapKeyRef:
                  key: PIPELINE_ADAPTER_IMG
                  name: kratix-platform-pipeline-adapter-config
            - name: KRATIX_LOGGER_PREFIX
              value: promise
          image: docker.io/syntasso/kratix-platform:dev
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
        - args:
            - --controllers=work
            - --metrics-bind-address=0
            - --health-probe-bind-address=0
            - --pprof-bind-address=0
            - --webhooks-enabled=false
            - --leader-elect
            - --leader-election-id=2743c979.work.kratix.io
          command:
            - /manager
          env:
            - name: KRATIX_LOGGER_PREFIX
              value: work
          image: docker.io/syntasso/kratix-platform:dev
          name: work-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - args:
            - --controllers=destination
            - --metrics-bind-address=0
            - --health-probe-bind-address=0
            - --pprof-bind-address=0
            - --webhooks-enabled=false
            - --leader-elect
            - --leader-election-id=2743c979.destination.kratix.io
          command:
            - /manager
          env:
            - name: KRATIX_LOGGER_PREFIX
              value: destination
          image: docker.io/syntasso/kratix-platform:dev
          name: destination-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - args:
            - --controllers=workplacement
            - --metrics-bind-address=0
            - --health-probe-bind-address=0
            - --pprof-bind-address=0
            - --webhooks-enabled=false
            - --leader-elect
            - --leader-election-id=2743c979.workplacement.kratix.io
          command:
            - /manager
          env:
            - name: KRATIX_LOGGER_PREFIX
              value: workplacement
          image: docker.io/syntasso/kratix-platform:dev
          name: workplacement-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - args:
            - --controllers=promiserelease
            - --metrics-bind-address=0
            - --health-probe-bind-address=0
            - --pprof-bind-address=0
            - --webhooks-enabled=false
            - --leader-elect
            - --leader-election-id=2743c979.promiserelease.kratix.io
          command:
            - /manager
          env:
            - name: KRATIX_LOGGER_PREFIX
              value: promiserelease
          image: docker.io/syntasso/kratix-platform:dev
          name: promiserelease-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - args:
            - --controllers=healthrecord
            - --metrics-bind-address=0
            - --health-probe-bind-address=0
            - --pprof-bind-address=0
            - --webhooks-enabled=false
            - --leader-elect
            - --leader-election-id=2743c979.healthrecord.kratix.io
          command:
            - /manager
          env:
            - name: KRATIX_LOGGER_PREFIX
              value: healthrecord
          image: docker.io/syntasso/kratix-platform:dev
          name: healthrecord-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - args:
            - --controllers=bucketstatestore
            - --metrics-bind-address=0
            - --health-probe-bind-address=0
            - --pprof-bind-address=0
            - --webhooks-enabled=false
            - --leader-elect
            - --leader-election-id=2743c979.bucketstatestore.kratix.io
          command:
            - /manager
          env:
            - name: KRATIX_LOGGER_PREFIX
              value: bucketstatestore
          image: docker.io/syntasso/kratix-platform:dev
          name: bucketstatestore-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - args:
            - --controllers=gitstatestore
            - --metrics-bind-address=0
            - --health-probe-bind-address=0
            - --pprof-bind-address=0
            - --webhooks-enabled=false
            - --leader-elect
            - --leader-election-id=2743c979.gitstatestore.kratix.io
          command:
            - /manager
          env:
            - name: KRATIX_LOGGER_PREFIX
              value: gitstatestore
          image: docker.io/syntasso/kratix-platform:dev
          name: gitstatestore-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - args:
            - --controllers=promiserevision
            - --metrics-bind-address=0
            - --health-probe-bind-address=0
            - --pprof-bind-address=0
            - --webhooks-enabled=false
            - --leader-elect
            - --leader-election-id=2743c979.promiserevision.kratix.io
          command:
            - /manager
          env:
            - name: KRATIX_LOGGER_PREFIX
              value: promiserevision
          image: docker.io/syntasso/kratix-platform:dev
          name: promiserevision-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - args:
            - --controllers=resourcebinding
            - --metrics-bind-address=0
            - --health-probe-bind-address=0
            - --pprof-bind-address=0
            - --webhooks-enabled=false
            - --leader-elect
            - --leader-election-id=2743c979.resourcebinding.kratix.io
          command:
            - /manager
          env:
            - name: KRATIX_LOGGER_PREFIX
              value: resourcebinding
          image: docker.io/syntasso/kratix-platform:dev
          name: resourcebinding-controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
      serviceAccountName: kratix-platform-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/component: certificate
    app.kubernetes.io/created-by: kratix
    app.kubernetes.io/instance: serving-cert
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: certificate
    app.kubernetes.io/part-of: kratix
  name: kratix-platform-serving-cert
  namespace: kratix-platform-system
spec:
  dnsNames:
    - kratix-platform-webhook-service.kratix-platform-system.svc
    - kratix-platform-webhook-service.kratix-platform-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: kratix-platform-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/component: certificate
    app.kubernetes.io/created-by: kratix
    app.kubernetes.io/instance: selfsigned-issuer
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: issuer
    app.kubernetes.io/part-of: kratix
  name: kratix-platform-selfsigned-issuer
  namespace: kratix-platform-system
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: kratix-platform-system/kratix-platform-serving-cert
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: kratix
    app.kubernetes.io/instance: mutating-webhook-configuration
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: mutatingwebhookconfiguration
    app.kubernetes.io/part-of: kratix
  name: kratix-platform-mutating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kratix-platform-webhook-service
        namespace: kratix-platform-system
        path: /mutate-platform-kratix-io-v1alpha1-destination
    failurePolicy: Fail
    name: mdestination.kb.io
    rules:
      - apiGroups:
          - platform.kratix.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - destinations
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kratix-platform-webhook-service
        namespace: kratix-platform-system
        path: /mutate-platform-kratix-io-v1alpha1-promise
    failurePolicy: Fail
    name: mpromise.kb.io
    rules:
      - apiGroups:
          - platform.kratix.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - promises
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
