apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  creationTimestamp: null
  name: redis
  labels:
    kratix.io/promise-version: v0.1.0
spec:
  destinationSelectors:
  - matchLabels:
      environment: dev
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: redis.marketplace.kratix.io
    spec:
      group: marketplace.kratix.io
      names:
        kind: redis
        plural: redis
        singular: redis
      scope: Namespaced
      versions:
        - name: v1alpha1
          schema:
            openAPIV3Schema:
              properties:
                spec:
                  properties:
                    size:
                      default: small
                      description: |
                        Size of this Redis deployment. If small, it deploy redis with a single replica; if large, deploy redis with 3 replicas.
                      pattern: ^(small|large)$
                      type: string
                  type: object
              type: object
          served: true
          storage: true
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: first-pipeline
          spec:
            containers:
              - image: ghcr.io/syntasso/kratix-marketplace/redis-configure-pipeline:v0.1.0
                name: redis-configure-pipeline
              - image: ghcr.io/syntasso/kratix-pipeline-utility:v0.0.1
                name: namespace-configure-pipeline
                command: ["sh"]
                args:
                  - -c
                  - |
                    set -eux
                    cat << EOF > /kratix/compound-requests/namespace.yaml
                    apiVersion: marketplace.kratix.io/v1alpha1
                    kind: namespace
                    metadata:
                      name: example
                      namespace: default
                    spec:
                      namespaceName: promised-namespace
                    EOF

                    ls /kratix/compound-requests/
                    echo "done"
                    exit 0
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: second-pipeline
          spec:
            containers:
              - image: ghcr.io/syntasso/kratix-pipeline-utility:v0.0.1
                name: namespace-configure-pipeline
                command: ["sh"]
                args:
                  - -c
                  - |
                    set -eux
                    sleep 1
    promise:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: promise-configure
          spec:
            containers:
              - image: ghcr.io/syntasso/kratix-marketplace/redis-configure-pipeline:v0.1.0
                name: redis-configure-pipeline

status: {}
